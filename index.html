<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EDE4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- seo:start -->
    <!-- Este bloque lo REESCRIBE scripts/prerender-meta.mjs, una vez por ruta,
         a partir de src/seo/pages.js. No editar los tags a mano: se pisan en
         el build. Los valores de abajo son los de la home. -->
    <link rel="alternate" hreflang="es-AR" href="https://www.psiquiatrix.ar/" />

    <title>PsiquiatriX | Psiquiatría online en Argentina con mirada humana</title>
    <meta
      name="description"
      content="Atención psiquiátrica online para adultos en Argentina. Criterio clínico, mirada humana y seguimiento real. Solicitá contacto con PsiquiatriX."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PsiquiatriX" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="PsiquiatriX | Psiquiatría online en Argentina con mirada humana" />
    <meta property="og:description" content="Atención psiquiátrica online para adultos en Argentina. Criterio clínico, mirada humana y seguimiento real." />
    <meta property="og:url" content="https://www.psiquiatrix.ar/" />
    <meta property="og:image" content="https://www.psiquiatrix.ar/og-psiquiatrix.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:image:alt" content="PsiquiatriX — Centro de psiquiatría online: psiquiatría profesional con mirada humana." />
    <!-- seo:end -->

    <!-- Fuentes propias (public/fonts/, declaradas en src/index.css).
         Se precargan las dos que aparecen de entrada: Inter Tight para todo
         el cuerpo de texto e Instrument Serif para los titulos. El atributo
         crossorigin es OBLIGATORIO aunque el archivo sea del mismo dominio:
         las fuentes se piden en modo CORS y sin el la precarga se descarta y
         el archivo se baja dos veces. -->
    <link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Analítica: Umami Cloud (plan Hobby, sin costo).
         Se eligió por sobre Google Analytics porque NO usa cookies ni recolecta
         datos personales: por eso el sitio no necesita banner de consentimiento,
         que en una práctica médica sería un estorbo y un problema de más.

         `defer` es importante: el script no bloquea el render. Es el único
         pedido a un tercero que hace el sitio (las fuentes son propias).

         El data-website-id NO es un secreto: viaja en el HTML público y sólo
         identifica al sitio dentro de la cuenta. Las credenciales son las del
         panel en cloud.umami.is, que no están acá.

         Umami detecta solo los cambios de ruta de React Router, así que
         /psicologos se mide sin agregar código. Los eventos de conversión se
         marcan en los componentes; ver src/lib/analytics.js. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="9b43146e-0ee3-40aa-a2c0-c66cbe646879"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Stubs estáticos para Netlify Forms.
      El bot de Netlify lee este HTML al desplegar para registrar los formularios
      y sus campos. Las versiones interactivas viven en los componentes React;
      el envío se hace por fetch POST a "/" con application/x-www-form-urlencoded.
    -->
    <form
      name="contacto-pacientes"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contacto-pacientes" />
      <input type="text" name="bot-field" />
      <input type="text" name="nombre" />
      <input type="tel" name="telefono" />
      <input type="email" name="mail" />
      <input type="text" name="destinatario" />
      <input type="text" name="conocimiento" />
      <textarea name="mensaje"></textarea>
    </form>

    <form
      name="contacto-psicologos"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contacto-psicologos" />
      <input type="text" name="bot-field" />
      <input type="text" name="nombre" />
      <input type="text" name="profesion" />
      <input type="text" name="enfoque" />
      <input type="tel" name="telefono" />
      <input type="email" name="mail" />
      <input type="text" name="conocimiento" />
      <input type="text" name="intencion" />
      <textarea name="mensaje"></textarea>
    </form>

    <form name="contacto-sumate" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto-sumate" />
      <input type="text" name="bot-field" />
      <input type="text" name="nombre" />
      <input type="text" name="instancia" />
      <input type="email" name="mail" />
      <input type="tel" name="telefono" />
      <textarea name="mensaje"></textarea>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
